# Example pipeline configuration.
# Copy to pipeline.config.yaml and fill in real values. Never commit secrets.

source:
  # Dynamic input: any repo URL or local path. Nothing is hardcoded.
  type: git            # git | local_path
  git: "https://github.com/tvw-programming/Alumni-web"
  local_path: null
  prefer: git           # which to use if both are set

detection:
  # DOCUMENTATION ONLY — unused at runtime. detect_project_type() reads
  # MARKER_FILES in src/detect/project_type.py, which also includes
  # build.gradle.kts (this YAML list does not). Compose YAML names live
  # in DOCKER_MARKERS in that same module, not here.
  markers:
    react_or_angular: ["package.json"]
    python: ["requirements.txt", "pyproject.toml", "setup.py"]
    go: ["go.mod"]
    spring_boot: ["pom.xml", "build.gradle"]
    docker: ["Dockerfile", "docker-compose.yml"]

chunking:
  small_max_lines: 200
  medium_max_lines: 800
  target_narration_seconds: [90, 180]

storage:
  mirror_root: "./output/chunks"   # dummy folder mirroring the client repo's structure
  required_fields: ["contentHash", "lastUpdated", "pullRequest"]

# UNUSED AT RUNTIME — stored on PipelineConfig.raw only. Roadmap for an
# LLM-elaborated narration stage; the live narrator is template-based.
llm:
  provider: anthropic          # anthropic | gemini | openai
  api_key_env: ANTHROPIC_API_KEY

security:
  never_read_patterns:
    - ".env*"
    - "*.pem"
    - "*secrets*"
  secret_scan_before_write: true

# UNUSED AT RUNTIME. Live TTS engines are Piper (preferred, Indian-English
# voice via scripts/ensure_piper_voice.py → .cache/piper-voices/) then
# espeak-ng fallback. See src/render/tts.py. This key is not read.
audio:
  tts_provider: null   # unused; live path is Piper then espeak-ng

# video.fps / video.resolution are unused (Remotion hardcodes 30 fps, 1280×720).
# video.phaseStyle is loaded at staging time and embedded on chunks/manifest.json
# for FullVideo / StackVideo (see src/config/phase_style.py).
video:
  fps: 30
  resolution: "1280x720"
  phaseStyle:
    fileCard: classic            # classic | fancy — default classic when omitted
    componentTree: classic
    lifecycle: classic
    chunkView: classic
    visualBreakdown: classic
    architectureDocs: classic    # docs cutaway only; not a FullVideo slot
